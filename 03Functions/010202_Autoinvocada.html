<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //funcion Autoinvocada dentro de otra
        const incrementador = (function(){
            let counter = 0;
            return function(){
                return ++counter;
            };
        })();
        //Visualizar
        console.log(incrementador());
        console.log(incrementador());
        console.log(incrementador());
        console.log(incrementador());
    </script>
</body>
</html>
