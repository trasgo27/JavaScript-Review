<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //Create a Number Array
        const numVector = [2,7,8,9,3,7];
        //Logic
        //iterative
        const sumarIterativa = function(array){
                let sumatorio = 0;
                for(let numero of array){
                    sumatorio += numero;
                }
                return sumatorio;
        }
        //recursiva
        const sumarRecursiva = function(array){
            //caso base
            if(array.length===0){
                return 0;
            }
            //caso recursivo
            return array[0]+ sumarRecursiva(array.slice(1));
        }
        //show
        console.log("Array: ",numVector);
        console.log("Metodo Sumatorio Iterativo: ", sumarIterativa(numVector));
        console.log("Metodo Sumatorio Recursivo: ", sumarRecursiva(numVector));
    </script>
</body>
</html>
