<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Four Colored Squares</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }

        #container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .square {
            width: 150px;
            height: 150px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 1.2em;
            text-transform: uppercase;
        }

        .square:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        .red { background-color: #e74c3c; }
        .blue { background-color: #3498db; }
        .green { background-color: #2ecc71; }
        .yellow { background-color: #f1c40f; color: #333; } /* Dark text for yellow */

    </style>
</head>
<body>

    <div id="container">
        <div id="square red" class="botones" data-color="Red">Red</div>
        <div id="square blue" class="botones" data-color="Blue">Blue</div>
        <div id="square green" class="botones" data-color="Green">Green</div>
        <div id="square yellow" class="botones" data-color="Yellow">Yellow</div>
    </div>

    <script>
        // --- Optional: Adding Interaction (Reviewing Events) ---

        // 1. Select the parent container (Event Delegation)
        const container = document.querySelector('#container');

        // 2. Add the 'click' event listener
        container.addEventListener('click', function(event) {
            
            // 3. Check if the clicked element is a square
            // We use .closest() to ensure it works even if clicking text inside
            const clickedSquare = event.target.closest('.square');

            if (clickedSquare) {
                // 4. Get the color name from the data attribute
                const colorName = clickedSquare.getAttribute('data-color');
                
                // 5. Provide feedback (Action!)
                alert(`You clicked the ${colorName} square!`);
                console.log(`Clicked: ${colorName}`);
            }
        });
    </script>

</body>
</html>
