<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const callback_BasedF = function(arg1,arg2,callback){
            //Realiza operaciones Asinc
            //Llama a la callback o funcion argumento 
            setTimeout(() => {
                const result = arg1 +arg2;
                if(result %2 !== 0){
                    callback(null, result);
                }else{
                    callback(new Error('Resultado no es IMPAR'),null);
                }
            },3000);
        };
        console.log(callback_BasedF(1,2, (err,res)=>{
            if(err){
                console.error("Error: ", err.message);
            }else{
                console.log("Bien!!! ", res);
            }
        }));
        console.log(callback_BasedF(2,2, (err,res)=>{
            if(err){
                console.error("Error: ", err.message);
            }else{
                console.log("Bien!!! ", res);
            }
        }));
        console.log('The task has been finalized ...');
        //Promisifying
        const funcionPromesa = function (arg1,arg2){
            const suma = arg1 +arg2;
            return new Promise((resolve,reject)=>{
                if( suma %2 !== 0){
                    resolve(suma);
                }else{
                
                    
                    reject(new Error("No es IMPAR!!!"));
                }
            });
            
        }
        const resultado = funcionPromesa(2,3);
        console.log(resultado);
        const resultado2 = funcionPromesa(2,2);
        console.log(resultado2);
    </script>
</body>
</html>
