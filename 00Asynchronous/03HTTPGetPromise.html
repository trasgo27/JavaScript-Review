<body>
    <h1>3. HTTP GET with Promises</h1>
    <p>Write a JavaScript a function that makes an HTTP GET request and returns a Promise that resolves with the
        response data.</p>
    <script>
        const hacerPeticionGet = function (url) {
            return new Promise((resolve, reject) => {
                fetch(url)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP error! Status: ${response.status}`);
                        }
                        return response.json();
                    })//Fin then
                    .then(data => resolve(data))
                    .catch(error => reject(error));
            }); //Fin Promesa
        };//Fin Funcion
    </script>
</body>

</html>
