<!DOCTYPE html>
<html>

<h1>JavaScript Promises</h1>
<h2>The .then() Method</h2>

<p id="demo"></p>

<script>
//Variables
    let xxx = document.getElementById("demo");

// Funtion to display something
function myDisplayer(some) {  
  xxx.innerHTML = some;
  console.log(some);
}

// Create a Promise Object
let myPromise = new Promise(function(resolve, reject) {
  ok = true;

// Code that might take some time goes here
   if (ok) {    
    resolve("Se Cumplió");     
  } else {
    reject("No se cumplio");    
  }
});

// Using then() to display the result
    myPromise//then and catch expect a function definition.
        .then(//Anonymous Function
            function (valor) {
                myDisplayer(valor);
                xxx.style.backgroundColor = "#00FF00";//green
                xxx.style.fontSize = "150px";
            }
        )
        .catch(//Arrow Function
            (valor)=> {
                myDisplayer(valor);
                xxx.style.backgroundColor = "#FF0000";
                xxx.color = "#ff00ff";//red and blue
                xxx.style.fontSize = "150px";
            }
        );
</script>
</body>
</html>
