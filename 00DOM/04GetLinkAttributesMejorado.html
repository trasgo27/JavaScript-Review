<!DOCTYPE html>

<h1>04. Get Link Attributes</h1>
<p>Here is a sample HTML file with a submit button.
    <br> Write a JavaScript function to get the value of the
    <br> href, hreflang, rel, target, and type attributes of the specified link.
</p>
<p><a id="w3r" class="a" type="text/html" hreflang="en-us" rel="nofollow" target="_self"
        href="https://www.w3resource.com/">w3resource</a></p>
<button onclick="conseguirAtributos()">Click here to get attributes value</button>
<script>
    function conseguirAtributos() {
        const miEnlace = document.getElementById("w3r"); 
        const miHref = miEnlace.getAttribute("href");
        const miHreflang = miEnlace.getAttribute("hreflang");
        const miRel = miEnlace.getAttribute("rel");
        const miTarget = miEnlace.getAttribute("target");
        const miType = miEnlace.getAttribute("type");
        alert(`Enlace: ${miEnlace}`+"\n"+
              `Href: ${miHref}`+"\n"+
              `Hreflang: ${miHreflang}` +"\n"+
              `rel: ${miRel}` +"\n"+
              `target: ${miTarget}` +"\n"+
              `type: ${miType}`
              
        );
    }

</script>



</body>

</html>
