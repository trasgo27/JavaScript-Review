<!DOCTYPE html>
<html>
<head>
<meta charset=utf-8 />
<title>JS DOM paragraph style</title>
<style>
    .cambiar{
        background-color: aliceblue;
        color: blue;
        font-size: 36px;
    }
</style>
</head> 
<body>
<p id ='text'>JavaScript Exercises - w3resource</p> 
<div>
<button id="jsstyle" onclick="js_style()">Style</button>
</div>
<script>
    function js_style(){
        miParrafo = document.getElementById("text");
        miParrafo.classList.toggle("cambiar");
    }
</script>
</body>
</html>
