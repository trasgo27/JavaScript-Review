<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #div-contenedor{
            border: 2px black solid;
            width:1000px;
            height: 500px;
            position: relative;
            padding: 5px;
        }
        #cuadrado-N{
            top:0px;
            left:450px;
        }
        #cuadrado-E{
            top:200px;
            left:900px;
        }
        #cuadrado-S{
            top:400px;
            left:450px;
        }
        #cuadrado-O{
            top:200px;
            left:0px;
        }
        #cuadrado-Centro{
            top:200px;
            left:450px;
            border:dotted;
        }

        .cuadrado{
            border: solid black 1px;
            width:100px;
            height: 100px;
            position: absolute;
            text-align: center;                        
        }
    </style>
</head>
<body>
    <div id="div-contenedor" class="">
        <div id="cuadrado-N" class="cuadrado">Norte</div>
        <div id="cuadrado-E" class="cuadrado">Este</div>
        <div id="cuadrado-S" class="cuadrado">Sur</div>
        <div id="cuadrado-O" class="cuadrado">Oeste</div>
        <div id="cuadrado-Centro" class="cuadrado">Target</div>
    </div>
    <div id="div-Resultado">Resultado</div>
    <script>
        class Cuadrado {
            constructor(id){
                //Mente
                this.id = id;
                this.esArrastrado = false;
                this.esCogido = false;
                //Cuerpo
                this.cuadrado = document.getElementById(id);
                this.posicionInicio = this.cuadrado.getBoundingClientRect();
                this.inicioX = this.posicionInicio.left;
                this.inicioY = this.posicionInicio.top;
                this.cuadrado.addEventListener('mousedown',(evento)=>{
                    this.cogerCuadrado(evento);
                });
                window.addEventListener('mousemove',(evento)=>{
                    this.arrastrarCuadrado(evento);                    
                });
                window.addEventListener('mouseup',()=>{
                    this.soltarCuadrado();
                });                
            }
            //Methods
            cogerCuadrado(evento){
                //cambiar estilo cursor
                this.esCogido = true;
                this.cuadrado.style.backgroundColor = "lightblue";

            }
            arrastrarCuadrado(evento){
                if(!this.esCogido) return;
                
                this.cuadrado.style.left =  (evento.clientX-50)+"px";
                this.cuadrado.style.top = (evento.clientY-50)+"px"; 
            }
            soltarCuadrado(){
                this.esCogido = false;
                this.cuadrado.style.backgroundColor="orange";
            }
        }
        //Instanciacion
        const c1 = new Cuadrado("cuadrado-N"); 
    </script>
</body>
</html>
