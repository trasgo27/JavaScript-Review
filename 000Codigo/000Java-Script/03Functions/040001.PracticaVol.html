<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //Matriz Palabras Minusculas
        const palabras = ["hola","huevo","carne","jamon","adios"];
        //Function
        const aMayusculas = function(cadena){
            return cadena.toUpperCase();
        }
        //Mostrar
        console.log("Cadena Inicial: ", palabras);
        console.log("Cadena Mayusculas: ", palabras.map(aMayusculas));
        
    </script>
</body>
</html>
