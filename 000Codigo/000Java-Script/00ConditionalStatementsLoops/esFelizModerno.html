    <script>
        const esFeliz = function(num){
            //registrar
            const historial = [];

           while(historial[num] != true && num !=1){
                historial[num] = true;
                num = num.toString()
                .split('')
                .reduce((total,num)=>{
                   return total +=num*num; 
                },0);
           }
           return num === 1;
        }
        let repe = 5;
        let i = 1;
        const exitos = [];

        while(repe > 0){
            if(esFeliz(i)){
