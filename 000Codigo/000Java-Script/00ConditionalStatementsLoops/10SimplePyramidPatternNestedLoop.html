<body>
    <h1>Create Simple Pyramid </h1>
    <h2>with Nested Loops</h2>
    <script>
        let x, y = 0;
        let cadena = "";
        //loop
        for (let i = 1; i < 6; i++) {
            for (let j = 0; j < i; j++) {
                cadena += " * ";
            }
            console.log(cadena);
            cadena = "";
        }
    </script>
</body>
