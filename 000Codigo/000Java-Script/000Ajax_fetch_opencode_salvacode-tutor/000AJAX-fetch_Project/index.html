<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Database Client</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🎬 Movie Database Client</h1>
        <p>Proyecto Integrador — AJAX &amp; fetch() — Módulo 8</p>
    </header>

    <main class="container">
        <!-- Search Bar -->
        <div class="search-bar">
            <input id="searchInput" type="text" placeholder="Buscar películas por título...">
            <button id="searchBtn">🔍 Buscar</button>
        </div>

        <!-- Stats -->
        <div id="stats" class="stats"></div>

        <!-- Loading State -->
        <div id="loading" class="loading" style="display:none;">
            <div class="spinner"></div>
            <p>Cargando películas...</p>
        </div>

        <!-- Error State -->
        <div id="error" class="error-state" style="display:none;"></div>

        <!-- Empty State -->
        <div id="empty" class="empty-state" style="display:none;"></div>

        <!-- Movie Grid -->
        <div id="movieGrid" class="movie-grid"></div>

        <!-- Pagination -->
        <div id="pagination" class="pagination"></div>

        <!-- Movie Detail Modal -->
        <div id="detailModal" class="modal" style="display:none;">
            <div class="modal-content">
                <button id="closeModal" class="close-btn">&times;</button>
                <div id="detailContent"></div>
            </div>
        </div>
    </main>

    <script src="js/debounce.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
