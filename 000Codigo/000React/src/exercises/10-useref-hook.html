<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 10: useRef Hook</title>
  
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
      color: #333;
    }
    .exercise { background: #f9f9f9; padding: 20px; border-radius: 8px; border: 1px solid #ddd; }
    section { margin-bottom: 30px; padding: 15px; background: white; border-radius: 4px; }
    h2 { color: #007acc; }
    h3 { color: #555; border-bottom: 2px solid #eee; padding-bottom: 5px; }
    
    button {
      padding: 10px 20px;
      margin: 5px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: #007acc;
      color: white;
    }
    
    input {
      padding: 8px;
      margin: 5px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    
    .focus-input { text-align: center; }
    .focus-input input { width: 200px; }
    
    .prev-value { text-align: center; }
    .prev-value h4 { font-size: 24px; }
    
    .stopwatch { text-align: center; }
    .stopwatch h4 { font-size: 48px; font-family: monospace; }
    
    .scroll-nav { margin-bottom: 10px; }
    .scroll-nav button { margin: 5px; }
    .scroll-container {
      height: 200px;
      overflow: auto;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    .scroll-section {
      height: 150px;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .scroll-section:nth-child(1) { background: #f0f0f0; }
    .scroll-section:nth-child(2) { background: #e0e0e0; }
    .scroll-section:nth-child(3) { background: #d0d0d0; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    // ============================================
    // EXERCISE 10.1: Focus Input
    // ============================================
    // useRef creates a mutable object: { current: initialValue }
    // We can attach it to a DOM element to access it directly
    
    function FocusInput() {
      const inputRef = React.useRef(null);
      const [inputValue, setInputValue] = React.useState('');
    
      // Access the DOM element via ref.current
      const handleFocus = () => {
        inputRef.current.focus();
        inputRef.current.select();  // Bonus: select all text
      };
    
      return (
        <div className="focus-input">
          {/* ref={inputRef} connects the ref to the DOM element */}
          <input 
            ref={inputRef} 
            value={inputValue} 
            onChange={e => setInputValue(e.target.value)} 
            placeholder="Click button to focus" 
          />
          <button onClick={handleFocus}>Focus Input</button>
          <p>Value: {inputValue}</p>
        </div>
      );
    }
    
    // ============================================
    // EXERCISE 10.2: Previous Value
    // ============================================
    // useRef persists values WITHOUT causing re-renders
    // Great for tracking previous values, timers, etc.
    
    function PreviousValue() {
      const [count, setCount] = React.useState(0);
      const [prevCount, setPrevCount] = React.useState(0);
      const countRef = React.useRef(count);
    
      // Update ref when count changes (doesn't cause re-render)
      React.useEffect(() => {
        countRef.current = count;
      }, [count]);
    
      const increment = () => {
        setPrevCount(countRef.current);  // Get previous value from ref
        setCount(c => c + 1);
      };
    
      return (
        <div className="prev-value">
          <h4>Count: {count}</h4>
          <p>Previous: {prevCount}</p>
          <button onClick={increment}>Increment</button>
        </div>
      );
    }
    
    // ============================================
    // EXERCISE 10.3: Stop Watch
    // ============================================
    // Store interval ID in ref to access it later
    
    function StopWatch() {
      const [elapsed, setElapsed] = React.useState(0);
      const [isRunning, setIsRunning] = React.useState(false);
      const intervalRef = React.useRef(null);
    
      const start = () => {
        if (isRunning) return;
        setIsRunning(true);
        intervalRef.current = setInterval(() => {
          setElapsed(e => e + 10);
        }, 10);
      };
    
      const stop = () => {
        setIsRunning(false);
        clearInterval(intervalRef.current);
      };
    
      const reset = () => {
        stop();
        setElapsed(0);
      };
    
      const formatTime = (ms) => {
        const minutes = Math.floor(ms / 60000);
        const seconds = Math.floor((ms % 60000) / 1000);
        const centiseconds = Math.floor((ms % 1000) / 10);
        return `${minutes}:${seconds.toString().padStart(2, '0')}.${centiseconds.toString().padStart(2, '0')}`;
      };
    
      // Cleanup on unmount
      React.useEffect(() => {
        return () => clearInterval(intervalRef.current);
      }, []);
    
      return (
        <div className="stopwatch">
          <h4>{formatTime(elapsed)}</h4>
          <button onClick={start} disabled={isRunning}>Start</button>
          <button onClick={stop} disabled={!isRunning}>Stop</button>
          <button onClick={reset}>Reset</button>
        </div>
      );
    }
    
    // ============================================
    // EXERCISE 10.4: Scroll to Element
    // ============================================
    // useRef can reference any DOM element for direct manipulation
    
    function ScrollExample() {
      const section1Ref = React.useRef(null);
      const section2Ref = React.useRef(null);
      const section3Ref = React.useRef(null);
    
      const scrollTo = (ref) => {
        ref.current.scrollIntoView({ behavior: 'smooth' });
      };
    
      return (
        <div className="scroll-example">
          <nav className="scroll-nav">
            <button onClick={() => scrollTo(section1Ref)}>Section 1</button>
            <button onClick={() => scrollTo(section2Ref)}>Section 2</button>
            <button onClick={() => scrollTo(section3Ref)}>Section 3</button>
          </nav>
          <div className="scroll-container">
            <section ref={section1Ref} className="scroll-section">
              <h4>Section 1</h4>
            </section>
            <section ref={section2Ref} className="scroll-section">
              <h4>Section 2</h4>
            </section>
            <section ref={section3Ref} className="scroll-section">
              <h4>Section 3</h4>
            </section>
          </div>
        </div>
      );
    }
    
    function UseRefHook() {
      return (
        <div className="exercise">
          <h2>Exercise 10: useRef Hook</h2>
          <section>
            <h3>10.1 Focus Input</h3>
            <p>Click the button to focus the input using a ref!</p>
            <FocusInput />
          </section>
          <section>
            <h3>10.2 Previous Value</h3>
            <p>Track the previous count without re-renders!</p>
            <PreviousValue />
          </section>
          <section>
            <h3>10.3 Stop Watch</h3>
            <p>Store interval ID in useRef for cleanup!</p>
            <StopWatch />
          </section>
          <section>
            <h3>10.4 Scroll to Element</h3>
            <p>Click buttons to scroll to different sections!</p>
            <ScrollExample />
          </section>
        </div>
      );
    }
    
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<UseRefHook />);
  </script>
</body>
</html>
