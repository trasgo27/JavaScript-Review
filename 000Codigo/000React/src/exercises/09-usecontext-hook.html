<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 09: useContext Hook</title>
  
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
      color: #333;
    }
    .exercise { background: #f9f9f9; padding: 20px; border-radius: 8px; border: 1px solid #ddd; }
    section { margin-bottom: 30px; padding: 15px; background: white; border-radius: 4px; }
    h2 { color: #007acc; }
    h3 { color: #555; border-bottom: 2px solid #eee; padding-bottom: 5px; }
    
    button {
      padding: 10px 20px;
      margin: 5px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: #007acc;
      color: white;
    }
    
    input {
      padding: 8px;
      margin: 5px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    
    /* Theme styles */
    .header-light { background: #fff; padding: 15px; border-radius: 4px; }
    .header-dark { background: #333; color: white; padding: 15px; border-radius: 4px; }
    .content-light { background: #f5f5f5; padding: 15px; border-radius: 4px; }
    .content-dark { background: #222; color: white; padding: 15px; border-radius: 4px; }
    
    /* User styles */
    .user-profile {
      padding: 15px;
      background: #d4edda;
      border-radius: 4px;
      margin-top: 10px;
    }
    
    ul { list-style: none; padding: 0; }
    li {
      padding: 10px;
      margin: 5px 0;
      background: #f5f5f5;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    li button { background: #dc3545; padding: 5px 10px; font-size: 12px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    // ============================================
    // THEME CONTEXT
    // ============================================
    // createContext() creates a context object
    // We pass a default value (or undefined)
    const ThemeContext = React.createContext();
    
    // ThemeProvider wraps children and provides theme data
    function ThemeProvider({ children }) {
      const [theme, setTheme] = React.useState('light');
    
      const toggleTheme = () => {
        setTheme(prev => prev === 'light' ? 'dark' : 'light');
      };
    
      // Provider makes value available to all children
      return (
        <ThemeContext.Provider value={{ theme, toggleTheme }}>
          {children}
        </ThemeContext.Provider>
      );
    }
    
    // Custom hook for using theme context
    function useTheme() {
      const context = React.useContext(ThemeContext);
      if (!context) {
        throw new Error('useTheme must be used within ThemeProvider');
      }
      return context;
    }
    
    // ============================================
    // EXERCISE 9.1: Theme Toggle
    // ============================================
    // Components can access context without prop drilling!
    
    function Header() {
      const { theme, toggleTheme } = useTheme();
    
      return (
        <header className={`header-${theme}`}>
          <h3>Current Theme: {theme}</h3>
          <button onClick={toggleTheme}>Toggle Theme</button>
        </header>
      );
    }
    
    function Content() {
      const { theme } = useTheme();
      return (
        <div className={`content-${theme}`}>
          <p>This content changes with the theme!</p>
          <p>No prop drilling needed - context provides the theme to any component.</p>
        </div>
      );
    }
    
    // ============================================
    // USER CONTEXT
    // ============================================
    const UserContext = React.createContext();
    
    function UserProvider({ children }) {
      const [user, setUser] = React.useState(null);
      const [notifications, setNotifications] = React.useState([]);
    
      const login = (userData) => {
        setUser(userData);
      };
    
      const logout = () => {
        setUser(null);
        setNotifications([]);
      };
    
      const addNotification = (message) => {
        setNotifications(prev => [...prev, { id: Date.now(), message }]);
      };
    
      const removeNotification = (id) => {
        setNotifications(prev => prev.filter(n => n.id !== id));
      };
    
      return (
        <UserContext.Provider value={{ 
          user, login, logout, 
          notifications, addNotification, removeNotification 
        }}>
          {children}
        </UserContext.Provider>
      );
    }
    
    function useUser() {
      return React.useContext(UserContext);
    }
    
    // ============================================
    // EXERCISE 9.2: User Login/Logout
    // ============================================
    function LoginForm() {
      const { login, user } = useUser();
      const [username, setUsername] = React.useState('');
    
      if (user) return null;  // Don't show if logged in
    
      const handleSubmit = (e) => {
        e.preventDefault();
        login({ name: username, role: 'user' });
        setUsername('');
      };
    
      return (
        <form onSubmit={handleSubmit}>
          <input 
            value={username} 
            onChange={e => setUsername(e.target.value)} 
            placeholder="Enter username" 
          />
          <button type="submit">Login</button>
        </form>
      );
    }
    
    function UserProfile() {
      const { user, logout, notifications, addNotification } = useUser();
      
      if (!user) return <p>Please log in to continue</p>;
    
      return (
        <div className="user-profile">
          <h4>Welcome, {user.name}!</h4>
          <p>Role: {user.role}</p>
          <p>Notifications: {notifications.length}</p>
          <button onClick={() => addNotification('New message received!')}>
            Add Notification
          </button>
          <button onClick={logout} style={{background: '#dc3545'}}>Logout</button>
        </div>
      );
    }
    
    // ============================================
    // EXERCISE 9.3: Nested Context Consumers
    // ============================================
    function NotificationBell() {
      const { notifications } = useUser();
      return <span>🔔 {notifications.length} notifications</span>;
    }
    
    function NotificationList() {
      const { notifications, removeNotification } = useUser();
      
      if (notifications.length === 0) {
        return <p>No notifications</p>;
      }
    
      return (
        <ul>
          {notifications.map(n => (
            <li key={n.id}>
              {n.message}
              <button onClick={() => removeNotification(n.id)}>X</button>
            </li>
          ))}
        </ul>
      );
    }
    
    // ============================================
    // MAIN COMPONENT
    // ============================================
    function UseContextHook() {
      return (
        <div className="exercise">
          <h2>Exercise 09: useContext Hook</h2>
          
          {/* ThemeProvider wraps Theme components */}
          <ThemeProvider>
            <section>
              <h3>9.1 Theme Context</h3>
              <p>Toggle the theme - both Header and Content update!</p>
              <Header />
              <Content />
            </section>
          </ThemeProvider>
    
          {/* UserProvider wraps User components */}
          <UserProvider>
            <section>
              <h3>9.2 User Context</h3>
              <LoginForm />
              <UserProfile />
            </section>
            <section>
              <h3>9.3 Notifications</h3>
              <NotificationBell />
              <NotificationList />
            </section>
          </UserProvider>
        </div>
      );
    }
    
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<UseContextHook />);
  </script>
</body>
</html>
