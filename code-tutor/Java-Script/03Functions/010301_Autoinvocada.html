<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonimous Inmediately Invoked Function Expression AIIFE</title>
</head>
<body>
    <h2>(function(p1,p2){logic})(parameter1,parameter2)</h2>
    <p>Función autoinvocada que reciba dos parámetros: <br>
        una cadena de texto y un número. <br>Dentro de la función, concatena la cadena con el 
número. <br> Muestra el resultado en consola. </p>

</body>
<script>
    //Variable
    const cadena = "Lo quiero, ";
    const numero = 5;
    //Logica
    //Mostrar Resultado
    console.log(function(a,b){return a+b;}(cadena,numero));
</script>
</html>
