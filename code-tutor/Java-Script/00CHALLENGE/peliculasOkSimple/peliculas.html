<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Películas</title>
    <style>
        #inputPresu{
            color:red;
        }
        #inputTaquilla{
            color: green;
            
        }
        #divLista {
            border: solid lightseagreen 3px;
            min-height: 50px;
            padding: 8px;
        }
        #divFiltro {
            border: solid tomato 3px;
            min-height: 50px;
            padding: 8px;
        }
        h1{
            color:red;
        }
    </style>
</head>
<body>
    <h1>🎬 Catá Pelis Simple</h1>

    <h3>Agregar película</h3>
    <form action="">
    <input type="text" id="inputTitulo" placeholder="Título" value="Rainman" required>
    <input type="text" id="inputGenero" placeholder="Género" value="Comedia" required>
    <input type="text" id="inputCast" placeholder="Actor01, Actor02" required value="Tom Hans, Dustin Hofman">
    <input type="number" id="inputPresu" placeholder="En millones" value="100" required>
    <input type="number" id="inputTaquilla" placeholder="En millones" value="300" required>
    <input type="number" id="inputAnio" placeholder="Año" value="1988" required>
    <button id="btnAgregar">Agregar</button>
    </form>


    <br><br>

    <h3>Filtrar por género</h3>
    <div id="divBotones">
        <button value="Acción">Acción</button>
        <button value="Comedia">Comedia</button>
        <button value="Drama">Drama</button>
        <button value="Ciencia Ficción">Ciencia Ficción</button>
        <button value="Terror">Terror</button>
    </div>

    <br>
    <div id="divLista"><strong>Todas las películas:</strong></div>
    <br>
    <div id="divFiltro"><strong>Filtradas:</strong></div>
    <script src="domElement.js"></script>
    <script src="catalogoIni.js"></script>
    <script src="peliculas.js"></script>
</body>
</html>
