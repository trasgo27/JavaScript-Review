<!DOCTYPE html>
<html>
<body>
<h1>JavaScript JSON</h1>
<h2>Create a JSON string from ant object.</h2>
<p id="demo"></p>

<script>
const myObj = {name: "John", age: 30, city: "New York"};
const myTextObj = JSON.stringify(myObj);
console.log(myTextObj);
const miDemo = document.getElementById('demo');
miDemo.innerHTML = myTextObj;
