<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #div-contenedor{
            border: 2px black solid;
            width:1000px;
            height: 500px;
            position: relative;
            padding: 5px;
        }
        #cuadrado-N{
            top:0px;
            left:450px;
        }
        #cuadrado-E{
            top:200px;
            left:900px;
        }
        #cuadrado-S{
            top:400px;
            left:450px;
        }
        #cuadrado-O{
            top:200px;
            left:0px;
        }
        #cuadrado-Centro{
            top:200px;
            left:450px;
            border:dotted;
        }

        .cuadrado{
            border: solid black 1px;
            width:100px;
            height: 100px;
            position: absolute;
            text-align: center;                        
        }
    </style>
</head>
<body>
    <div id="div-contenedor" class="">
        <div id="cuadrado-N" class="cuadrado">Norte</div>
        <div id="cuadrado-E" class="cuadrado">Este</div>
        <div id="cuadrado-S" class="cuadrado">Sur</div>
        <div id="cuadrado-O" class="cuadrado">Oeste</div>
        <div id="cuadrado-Centro" class="cuadrado">Target</div>
    </div>
    <div id="div-Resultado">Resultado</div>
    <script>
        //Class
        //id para unirlo al HTML
        //Posicion Inicial por si quiero volver
        //Posicion Actual 
        //esArrastrado boolean
        class Cuadrado {
            constructor(id){
                //Variables
                this.esArrastrado = false;
                //this. esCogido = false;
                this.id = id;
                this.cuadrado = document.getElementById(id);
                //this.InicialXY = this.cuadrado.getClientRects();
                //this.InicialX = this.InicioXY.clientX;
                //this.InicialXY = this.InicioXY.clientY; 
                //Event Listeners
                this.cuadrado.addEventListener('mousedown',(e)=>{
                    //this.posicionInicio(e);
                    //this.cambiarColor();   
                    this.coger(e);               
                });
                window.addEventListener('mousemove',(e)=>{
                    this.mover(e);
                });
                window.addEventListener('mouseup',(e)=>{
                    this.soltar(e);
                });
            }
            //Methods
            cambiarColor(){
                this.cuadrado.style.backgroundColor = "pink";
                console.log(this.id);
            }
            coger(e){
                //this.esCogido = true;
                this.cambiarColor();
                this.esArrastrado = true;
            }
            mover(e){
                if(!this.esArrastrado) return;
                this.cuadrado.style.left = (e.clientX-50) + "px";
                this.cuadrado.style.top  = (e.clientY-50) + "px"; 
            }
            soltar(e){
                this.esArrastrado = false;
            }
        }
        //Instances
            const c1 = new Cuadrado("cuadrado-N");
    </script>
</body>
</html>
