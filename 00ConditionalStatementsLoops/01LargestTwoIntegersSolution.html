<body>
    <h1>01.- Largest of Two Integers</h1>
    <h2>Ternary Operators</h2>
    <h2>ES06 shorthand code</h2>
    <p>Write a JavaScript program that displays the largest integer among two integers.</p>
    <a href="https://www.w3resource.com/javascript-exercises/javascript-conditional-statements-and-loops-exercises.php">Conditional
        Statements and Loops</a>

    <script>
        // Declare variables to store input values
        var num1, num2;

        // Uncomment the following lines to take input from the user
        // num1 = window.prompt("Input the First integer", "0");
        // num2 = window.prompt("Input the second integer", "0");
        num1 = Math.floor(Math.random() * 100 + 1);
        num2 = Math.floor(Math.random() * 100 + 1);
        // Compare the values and print the larger or equality message
        if (parseInt(num1, 10) > parseInt(num2, 10)) {
            console.log("The larger of " + num1 + " and " + num2 + " is " + num1 + ".");
        } else if (parseInt(num2, 10) > parseInt(num1, 10)) {
            console.log("The larger of " + num1 + " and " + num2 + " is " + num2 + ".");
        } else {
            console.log("The values " + num1 + " and " + num2 + " are equal.");
        }
    </script>
