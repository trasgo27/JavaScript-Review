    <h1>9.- 3-Digit Armstrong Numbers</h1>
    <h2>split()</h2>
    <p>Write a JavaScript program to find the Armstrong numbers of ANY NUMBER OF  digits.
        <br>4-Digit: 1634, 8208, 9474
        <br>For example, 371 is an Armstrong number since 3**3 + 7**3 + 1**3 = 371.
    </p>
    <script>
        /*const descomponerEnDigits = function (num) {
            const vectorDigi = [];
            let deci01 = 0;
            while (num > 0) {
                deci01 = num % 10;//384 > 4
                num = (num - deci01) / 10;//num = 384-4/10 = 38
                vectorDigi.push(deci01);
            }
            return vectorDigi;
        }*/
       const descomponerEnDigits = function(num){
            return num.toString().split('');
       }

        //funcion esArmStrong()
        const esArmS = function (num) {
            //convertir en vector
            let vector = descomponerEnDigits(num);
            //const longi = vector.length();
            let sumaCubo  = vector.reduce((total, digit)=>{
                return total + (digit ** 3);
            },0); //Starting the 'total' variable at 0
            //this returns true or false automatically
            return num === sumaCubo;
        }
        //Funcion Iterar de 100 a 1000
        const repetir = function () {
            //conseguir num ArmStrong numeros
            const vectorExitos = [];
            for (let i = 100; i < 1000; i++) {
                if (esArmS(i)) {
                    vectorExitos.push(i);
                }
            }
            return vectorExitos;
        }
        //Mostrar
        console.table(descomponerEnDigits(19));
        console.table(descomponerEnDigits(123));
        console.table(descomponerEnDigits(5));
        console.log(esArmS(1));
        console.log(`true: ${esArmS(153)}`);
        console.log(esArmS(100));
        console.log(esArmS(370));
        console.log(`Vector Repetir: ${repetir(5)}`);
        console.log(`Vector Repetir: 11111 >>> ${repetir(11111)}` );
    </script>
