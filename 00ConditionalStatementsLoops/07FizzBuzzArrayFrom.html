<body>
    <h1>7.- FizzBuzz</h1>
    <h2 style="color:purple">Array.from()</h2>
    <p>Write a JavaScript program that iterates integers from 1 to 100.
        <br> But for multiples of three print "Fizz" instead of the number and for multiples of five print "Buzz".
        <br> For numbers multiples of both three and five print "FizzBuzz".
    </p>
    <script>
        //variables
        let report = "= = = Reporte Final = = =\n";
        //Logica
        const esFizzBuzz = function (num) {
            if (num % 3 == 0 && num % 5 == 0) {
                return "FizzBuzz";
            } else if (num % 3 == 0) {
                return 'Fizz';
            } else if (num % 5 == 0) {
                return 'Buzz';
            } else {
                return num;
            }
        }
        const vectorFizzBuzz = Array.from({ length: 100 }, (_, i) => {
            return esFizzBuzz(i + 1); //In arrow function and curly braces you need a return
        });


        console.table(vectorFizzBuzz);
    </script>
</body>
