<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>

        #div-Resultado{

        }
        #div-Controles{
            border: 2px black solid;

        #cuadrado-N{
            top:0px;

<body>
    <div id="div-contenedor" class="">
        <div id="cuadrado-N" class="cuadrado">Norte</div>
        <div id="cuadrado-E" class="cuadrado">Este</div>
        <div id="cuadrado-S" class="cuadrado">Sur</div>
        <div id="cuadrado-O" class="cuadrado">Oeste</div>
        <div id="cuadrado-Centro" class="cuadrado">Target</div>
    </div>
    <div id="div-Resultado">Resultado</div>
    <div id="div-Controles">Controles
        <br>
        <button onclick="ManagervolverAlInicio()">SALIDA</button>
        <button onclick="managerGuardar()">Guardar</button>
        <button onclick="managerBorrar()">Borrar</button>
    </div>
<script>
    //Limites de DIV Contenedor
    const contenedor = document.getElementById("div-contenedor");
    //const contePosi = contenedor.getClientRects();
    //const contePosiIzq = contePosi.left;
    //const contePosiDer = contePosi.left + 1000;
    //const contePosiArri = contePosi.top;
    //const contePosiAbaj = contePosi.top + 500;
    //LOGICA
    const cambiarDiv = function(){

    }
    const cambiarMovimiento = function(){
        
    }
    const cambiarSeleccionar = function(){

    }
    const cambiarDesSeleccionar = function(){

    }
    //Clase
    //conectar con id con el HTML
    //ATRIBUTOS
    //posicion Inicial
    //posicion Actual
    //estaEnFoco? Boolean
    //METODOS
    //Seleccionar clicando sobre él
    //Moverlo
    //Des-seleccionarlo
    class Caja {
        constructor(id){
            this.id = id;
            this.enFoco = false;
            this.caja = document.getElementById(id);
            this.puntoInicio = this.caja.getBoundingClientRect();
            //eventListener
            this.caja.addEventListener('mousedown',(e)=>{
                this.seleccionar(e);
            });
            window.addEventListener('mousemove',(e)=>{
                this.mover(e);
            });
            window.addEventListener('mouseup',(e)=>{
                this.desseleccionar(e);
            });
        }
        //Metodos
        volverAlInicio() {
            this.contenedor = document.getElementById("div-contenedor");
            this.contRect   = this.contenedor.getBoundingClientRect();
            const startX    = this.puntoInicio.left;//falta restar lo relativo -contePosi.left;
            const startY   =  this.puntoInicio.top;//falta restar lo relativo -contePosi.top;
            this.caja.style.left = startX +"px";
            this.caja.style.top  = startY + "px";
        }
        seleccionar(e){
            this.enFoco = true;
            //Cambiar Estilo
            cambiarSeleccionar();
            //Cambiar Puntero
            cambiarDiv();
                      
        }
        mover(e){
            if(!this.enFoco) return;
            this.contenedor = document.getElementById("div-contenedor");
            this.contRect = this.contenedor.getBoundingClientRect();
            //Dimensiones Caja
            const cajaAncho = this.caja.offsetWidth;
            const cajaAlto  = this.caja.offsetHeight;
            console.log("const cajaAlto  = this.caja.offsetHeight: " + this.caja.offsetHeight);
            //Posicion RELATIVA
            let RelativaX = (e.clientX-this.contRect.left) - cajaAncho/2;
            let RelativaY = (e.clientY-this.contRect.top)  - cajaAlto/2;
             
            //Dentro de los limites
            RelativaX = Math.max(0,Math.min(RelativaX,this.contRect.width  - cajaAncho ));
            RelativaY = Math.max(0,Math.min(RelativaY,this.contRect.height - cajaAlto  ));
            
            //Mover
            this.caja.style.left = RelativaX + "px";
            this.caja.style.top   = RelativaY + "px";

            //Cambiar Estilo
            cambiarMovimiento();
            this.caja.style.backgroundColor="pink";
            this.caja.style.zIndex=10;
        }
        desseleccionar(e){
            if(!this.enFoco) return;
            this.enFoco = false;
            //Cambiar Estilo
            cambiarDesSeleccionar();
            //this.caja.style.backgroundColor="white";

            //Crear Promesa
            const miPromesa = new Promise((resolve,reject)=>{
                this.posiCaja   = this.caja.getBoundingClientRect();
                this.posiTarget = document.getElementById("cuadrado-Centro").getBoundingClientRect();
                this.hueco = 
                    this.posiCaja.right < this.posiTarget.left  ||
                    this.posiCaja.left  > this.posiTarget.right ||
                    this.posiCaja.bottom < this.posiTarget.top  ||
                    this.posiCaja.top    > this.posiTarget.bottom;
                if(!this.hueco){
                    resolve("CONSEGUIDO!!!"); 
                }else{
                    reject("Nooo!!!");
                }
            });  
            miPromesa
            .then((e)=>{
                this.caja.style.backgroundColor='lightgreen';
                console.log(e);
            })
            .catch((e)=>{
                this.caja.style.backgroundColor='red';
                console.log(e);
            });
        }
    }
    //Instancia
    const cN = new Caja("cuadrado-N");
    const cE = new Caja("cuadrado-E");
    const cS = new Caja("cuadrado-S");
    const cO = new Caja("cuadrado-O");
    //Logica
    function ManagervolverAlInicio(){
        cN.volverAlInicio();
        cE.volverAlInicio();
        cS.volverAlInicio();
        cO.volverAlInicio();
    }  
    function managerGuardar(){
        const estadoActual = {
            //State Object with the current position
            norte: {x:cN.caja.style.left, y:cN.caja.style.top},
            este:  {x:cE.caja.style.left, y:cE.caja.style.top},
            sur:   {x:cS.caja.style.left, y:cS.caja.style.top},
            oeste: {x:cO.caja.style.left, y:cO.caja.style.top}
        };
        //Convert to String and Save
        //We use key
        localStorage.setItem("posicionesCajas",JSON.stringify(estadoActual));
        console.log("Progreso Guardado!!!");
        alert("Posiciones Guardas en el Navegador");
    }  
    // This runs automatically when you open the page
window.onload = function() {
    const datosGuardados = localStorage.getItem("posicionesCajas");

    if (datosGuardados) {
        const posiciones = JSON.parse(datosGuardados);

        // Apply saved positions to the style of each box
        cN.caja.style.left = posiciones.norte.x;
        cN.caja.style.top  = posiciones.norte.y;

        cE.caja.style.left = posiciones.este.x;
        cE.caja.style.top  = posiciones.este.y;

        cS.caja.style.left = posiciones.sur.x;
        cS.caja.style.top  = posiciones.sur.y;

        cO.caja.style.left = posiciones.oeste.x;
        cO.caja.style.top  = posiciones.oeste.y;
        
        console.log("¡Posiciones recuperadas!");
    }
};
function managerBorrar(){
    //Remove Local Storage
    localStorage.removeItem("posicionesCajas");
    //Feedback for the user
    console.log("");
    alert("Posiciones de Memoria Borradas");
}

</script>
</body>
</html>
