<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //crear array
        const letras = ["have","been","training","abs"];
        //definir Funcion
        function aMayusculas(palabra){
            return palabra.toUpperCase();
        };
        //aplicar map
        const resultado = letras.map(aMayusculas);
        //mostrar
        console.log("Matriz Inicial: ", letras);
        console.log("Matriz Mayuscula: ", resultado);
    </script>
</body>
</html>
