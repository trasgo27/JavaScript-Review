<!DOCTYPE html>

    <title>Multiply by 2</title>

<body>
    <!--Description : Given an array of numbers, multiply each element by 2 and return the result in a new array.-->
    <h1>Multiply a Number Array by 2</h1>
    <h2>  <br>Arrow Function</h2>
    <h3></h3>
    <script>
        //Create Random Number Array
        const longitud = 20;
        const long_baja = 10;
        const vectorNum =  [];
        const vectorNum2 =  [];
        for (let i=0;i<longitud-long_baja;i++){
            vectorNum[i] = Math.floor(Math.random()*15)+1;
        }
        //Create low Numbers
        for (let i=longitud-long_baja;i<longitud;i++){
            vectorNum[i] = Math.floor(Math.random()*10)+1;
        }
        //Create a Second Number Arrow
        for (let i=0;i<longitud-long_baja;i++){
            vectorNum2[i] = Math.floor(Math.random()*15)+1;
        }
        //Create low Numbers
        for (let i=longitud-long_baja;i<longitud;i++){
            vectorNum2[i] = Math.floor(Math.random()*10)+1;
        }
        //Create Arrow Bubble Function
        const copy = [...vectorNum];
        const copy2 = [...vectorNum2];
        
        //algorithm
        let long = copy.length;
        let long2 = copy2.length;
        
         
        
        vectorUnion = [...copy,...copy2];
        vectorUnionUnico =  [...new Set(vectorUnion)];
                             
        //Show Results
        console.log("Matriz Inicial UNO: ",vectorNum);
        console.log("Matriz Inicial DOS: ",vectorNum2);
        console.log("Matriz UNION: ",vectorUnion);
        console.log("Matriz UNION No REPE: ",vectorUnionUnico);
    </script>    
</body>
