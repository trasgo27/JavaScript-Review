<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #div2{

            background: yellow;
            font-weight:bolder;
            font-size:24px;
            color:red;
        }
    </style>

        <br><br>
        Continente:
        <input type="text" id="inputC">
        <br><br>
        <button id="boton">Enviar</button>
    </div>
    <div id="div2">

    </div>
    <div id="div3">
        <button data-continente = "África" id="botonAfrica">África</button>
        <button data-continente = "Asia" id="botonAsia">Asia</button>
        <button data-continente = "Europa" id="botonEuropa">Europa</button>
        <button data-continente = "Norte América" id="botonNorte">Norte América</button>
        <button data-continente = "Sudamérica" id="botonSuda">Sudamérica</button>

    </div>
    <div id="div4"></div>
