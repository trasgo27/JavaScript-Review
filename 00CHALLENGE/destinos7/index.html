<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #div1{
            border: solid rebeccapurple 3px;
            border-radius: 10px;

            margin-bottom: 5px;
        }
        .divContinente{
            border: solid rgb(239, 192, 227) 3px;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 5px;
        }
        .divContinente:hover{
            background-color: lightyellow;
            color: red;

        #div2{
            border: solid lightblue 3px;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 10px;
        }
        #div3{
            border: solid lightgreen 3px;
            border-radius: 10px;

        }

<body>
    <h1>Destinos 09:20</h1>

    <br><br>

    <br><br>
    <button id="botonEnviar">Enviar</button>
    <br><br>
    <div id="div1">
        Mostrar Catalogo
    </div>

        <button id="bAfrica" value="África">África</button>
        <button id="bNorte" value="Norte América">Norte América</button>
        <button id="BSuda" value="Sudamérica">Sudamérica</button>
        <button id="bEuropa" value="Europa">Europa</button>

    <div id="div3">

    <script src="dom.js"></script>
